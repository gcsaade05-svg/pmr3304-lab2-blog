{% extends 'base.html' %}

{% block title %}
Editar post
{% endblock title %}

{% block content %}
<div class="card p-4">
    <h2>Editar Post "{{ post.title }}"</h2>
    <form method="post" action="{% url 'blog:update' post.id %}">
        {% csrf_token %}
        <p>
            <label for="id_title">Título:</label>
            <input type="text" name="title" id="id_title" value="{{ post.title }}" />
        </p>
        <p>
            <label for="id_content">Conteúdo (HTML):</label>
            <textarea name="content" id="id_content">{{ post.content }}</textarea>
        </p>
        <button class="btn btn-primary" type="submit">Atualizar</button>
    </form>
</div>
{% endblock content %}
