{% extends 'base.html' %}

{% block title %}
Novo post
{% endblock title %}

{% block content %}
<div class="card p-4">
    <h2>Criar Novo Post</h2>
    <form method="post" action="{% url 'blog:create' %}">
        {% csrf_token %}
        {{ form.as_p }}
        <button class="btn btn-primary" type="submit">Criar</button>
    </form>
</div>
{% endblock content %}
