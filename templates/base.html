{% load static %}
<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>
        {% block title %}{% endblock title %} | Pit Stop
    </title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
    <link rel="stylesheet" type="text/css" href="{% static 'style.css' %}">
</head>

<body>
    <header id="cabecalho-principal" class="navbar">
        <nav id="navegacao-principal" class="container">
            <a class="navbar-brand" href="{% url 'blog:index' %}"><span class="bandeira"></span>Pit Stop</a>
            <ul class="navbar-nav flex-row gap-3">
                <li class="nav-item"><a class="nav-link" href="{% url 'blog:index' %}">Posts</a></li>
                <li class="nav-item"><a class="nav-link" href="{% url 'blog:create' %}">Novo post</a></li>
            </ul>
        </nav>
    </header>
    <div class="faixa-quadriculada"></div>

    <main id="conteiner-principal" class="container">
        {% block content %}
        {% endblock content %}
    </main>

    <footer id="rodape-principal" class="container text-center">
        <p><small>PMR3304 - Segunda entrega de laboratório - Gabriel Crisci Saade</small></p>
    </footer>
</body>

</html>
